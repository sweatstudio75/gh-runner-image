name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install semantic-release
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Run semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAGS_BEFORE=$(git tag -l | sort)
          npx semantic-release
          git fetch --tags --quiet origin || true
          TAGS_AFTER=$(git tag -l | sort)
          NEW_TAG=$(comm -13 <(echo "$TAGS_BEFORE") <(echo "$TAGS_AFTER") | head -1)
          if [ -n "$NEW_TAG" ]; then
            echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
            echo "Released: $NEW_TAG"
          else
            echo "No release created."
          fi

      # Tag pushes by GITHUB_TOKEN do not trigger downstream workflows.
      # Explicitly dispatch the image build workflow against the new tag.
      - name: Trigger image build for new tag
        if: steps.release.outputs.new_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build.yml \
            --ref "${{ steps.release.outputs.new_tag }}" \
            --repo "${{ github.repository }}"
