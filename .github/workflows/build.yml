name: Build and push runner image

on:
  push:
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Reconstruction hebdomadaire. Sans elle, l'image ne se reconstruisait QUE
  # sur un tag ou une main levee : la derniere datait du 2026-06-29, elle
  # portait le runner 2.335.1, et le service d'auto-update du poste a passe
  # trois mois a tirer fidelement un digest que plus rien ne rafraichissait.
  # `docker pull` n'est pas `docker build` — le premier ne repare jamais une
  # depreciation en amont. Lundi 04:17 UTC, decale pour ne pas tomber sur
  # l'heure ronde que tout le monde demande.
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  base:
    name: Build base (Node 24)
    # Construit sur un runner HEBERGE, delibérément — voir la panne du
    # 2026-09-28. L'ancien commentaire justifiait le pool auto-heberge par
    # « so image builds don't consume the account's shared GitHub-hosted
    # Actions minutes » : ce depot est PUBLIC, donc ces minutes sont
    # gratuites et illimitees. La raison n'en etait pas une.
    #
    # Ce qu'elle coutait, en revanche : un VERROU CIRCULAIRE. Le 2026-09-28,
    # GitHub a coupe le runner 2.335.1 (« is deprecated and cannot receive
    # messages ») ; chaque runner s'est desenregistre tout seul au demarrage,
    # `actions/runners` est tombe a total_count=0, et la seule façon de
    # reconstruire l'image portant un runner recent etait... un job sur ces
    # memes runners. La reparation avait besoin de ce qu'elle reparait.
    #
    # Le telechargement Playwright de Dockerfile.chrome n'a plus besoin de la
    # ruse du bridge IPv4 : elle compensait l'IPv6 casse de l'hote homelab,
    # absent ici.
    runs-on: ubuntu-latest
    outputs:
      sha-tag: ${{ steps.compute.outputs.sha_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute SHA tag
        id: compute
        run: echo "sha_tag=sha-${GITHUB_SHA::7}-base" >> "$GITHUB_OUTPUT"

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-base,onlatest=true
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,scope=base,mode=max

  chrome:
    name: Build chrome (base + Chrome)
    needs: base
    if: github.event_name != 'pull_request'
    # Construit sur un runner HEBERGE, delibérément — voir la panne du
    # 2026-09-28. L'ancien commentaire justifiait le pool auto-heberge par
    # « so image builds don't consume the account's shared GitHub-hosted
    # Actions minutes » : ce depot est PUBLIC, donc ces minutes sont
    # gratuites et illimitees. La raison n'en etait pas une.
    #
    # Ce qu'elle coutait, en revanche : un VERROU CIRCULAIRE. Le 2026-09-28,
    # GitHub a coupe le runner 2.335.1 (« is deprecated and cannot receive
    # messages ») ; chaque runner s'est desenregistre tout seul au demarrage,
    # `actions/runners` est tombe a total_count=0, et la seule façon de
    # reconstruire l'image portant un runner recent etait... un job sur ces
    # memes runners. La reparation avait besoin de ce qu'elle reparait.
    #
    # Le telechargement Playwright de Dockerfile.chrome n'a plus besoin de la
    # ruse du bridge IPv4 : elle compensait l'IPv6 casse de l'hote homelab,
    # absent ici.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-chrome,onlatest=true
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.chrome
          push: true
          build-args: |
            BASE_IMAGE=${{ env.IMAGE_NAME }}:${{ needs.base.outputs.sha-tag }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=chrome
          cache-to: type=gha,scope=chrome,mode=max
